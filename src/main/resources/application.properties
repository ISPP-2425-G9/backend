spring.application.name=caronte
spring.datasource.url=jdbc:mysql://localhost:3306/caronte
spring.datasource.username=caronte_user
spring.datasource.password=caronte_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Propereties
caronte.app.jwt.secret=secret
caronte.app.jwt.expirationMs= 86400000 